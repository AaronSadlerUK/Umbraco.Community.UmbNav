assembly-versioning-scheme: MajorMinorPatch
mode: ContinuousDelivery
next-version: 5.0.0
branches:
  main:
    regex: ^main$
    mode: ManualDeployment
    label: ''
    increment: Patch
    prevent-increment:
      of-merged-branch: true
    track-merge-target: false
    source-branches: [ 'rc', 'release' ]
    tracks-release-branches: false
    is-release-branch: true
    is-main-branch: true
    pre-release-weight: 55000
  dev-v17:
    regex: ^dev/v17$
    mode: ContinuousDelivery
    label: beta
    increment: Patch
    prevent-increment:
      of-merged-branch: false
    track-merge-target: true
    source-branches: []
    tracks-release-branches: true
    is-release-branch: false
    is-main-branch: false
    pre-release-weight: 0
  dev-v18:
    regex: ^dev/v18$
    mode: ContinuousDelivery
    label: beta
    increment: Patch
    prevent-increment:
      of-merged-branch: false
    track-merge-target: true
    source-branches: []
    tracks-release-branches: true
    is-release-branch: false
    is-main-branch: false
    pre-release-weight: 0
  # The per-major development branches (dev/v17, dev/v18) don't match the `develop` regex above,
  # so without this they fall back to a branch-named label and prereleases come out as
  # 4.1.9-dev-v17.1 instead of 4.1.9-beta.1.
  dev-major:
    regex: ^dev[/-]
    mode: ContinuousDelivery
    label: beta
    increment: Patch
    prevent-increment:
      of-merged-branch: false
    track-merge-target: true
    source-branches: []
    tracks-release-branches: true
    is-release-branch: false
    is-main-branch: false
    pre-release-weight: 0
  rc:
    regex: ^rc$
    mode: ContinuousDelivery
    label: rc
    increment: Patch
    prevent-increment:
      of-merged-branch: false
    track-merge-target: true
    source-branches: [ 'dev-v17', 'dev-v18' ]
    tracks-release-branches: false
    is-release-branch: false
    is-main-branch: false
    pre-release-weight: 30000
  release:
    regex: ^releases?[/-]
    mode: ManualDeployment
    label: rc
    increment: None
    prevent-increment:
      of-merged-branch: true
    track-merge-target: false
    source-branches: [ 'dev-v17', 'dev-v18', 'main', 'support', 'release' ]
    tracks-release-branches: false
    is-release-branch: true
    is-main-branch: false
    pre-release-weight: 30000
ignore:
  sha: []
merge-message-formats: {}
